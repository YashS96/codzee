# Production must supply secrets through the environment; there are no fallbacks here.
postgres:
  url: ${DATABASE_URL}
  poolMax: 50
redis:
  url: ${REDIS_URL}
auth:
  # Lower cost factor keeps login p99 under 150ms on our instance size.
  bcryptRounds: 8
  jwt:
    secret: ${JWT_SECRET}
server:
  cors:
    origins: []
